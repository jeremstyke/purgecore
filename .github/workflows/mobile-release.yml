name: Mobile Release

# Triggered by pushing a tag like mobile-v1.0.0. Builds an unsigned release
# APK from the mobile/ project and publishes it to the GitHub Release for
# that tag. Separate from the main "Release" workflow (Windows), which only
# triggers on plain v*.*.* tags.

on:
  push:
    tags:
      - "mobile-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager at $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: mobile
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find mobile/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" "PurgeCoreMobile-${{ steps.version.outputs.version }}.apk"

      - name: Generate checksum
        run: sha256sum "PurgeCoreMobile-${{ steps.version.outputs.version }}.apk" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PurgeCore Mobile v${{ steps.version.outputs.version }}"
          files: |
            PurgeCoreMobile-${{ steps.version.outputs.version }}.apk
            SHA256SUMS.txt
          body: |
            PurgeCore Mobile v${{ steps.version.outputs.version }}

            Unsigned release APK, install directly on Android (enable "Install unknown apps" for your browser or file manager if prompted). Not yet on Google Play.
